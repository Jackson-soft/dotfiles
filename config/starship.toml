"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
# lower than upstream default so a stalled external command (git/cloud CLIs) can't stall the prompt
command_timeout = 500
scan_timeout = 10

format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$character"""

right_format = """
$cmd_duration\
$jobs\
$direnv\
$golang\
$c\
$nodejs\
$python\
$docker_context\
$kubernetes\
$terraform\
$aws\
$gcloud\
$username\
$hostname"""

[character]
success_symbol = "[❯](bold #b8bb26)"
error_symbol = "[❯](bold #fb4934)"
vimcmd_symbol = "[❮](bold #b8bb26)"

[directory]
style = "bold #83a598"
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = ""
style = "bold #b8bb26"
format = "[$symbol$branch]($style) "

[git_commit]
style = "bold #fabd2f"
tag_symbol = " 🏷 "
format = '[\($hash$tag\)]($style) '

[git_state]
style = "bold #fb4934"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
style = "#fabd2f"
format = '([$all_status$ahead_behind]($style)) '
staged = '[+$count](#b8bb26) '
modified = '[!$count](#fabd2f) '
deleted = '[✘$count](#fb4934) '
renamed = '[»$count](#83a598) '
untracked = '[?$count](#928374) '

[cmd_duration]
min_time = 3000
style = "#d3869b"
format = " took [$duration]($style)"

[jobs]
style = "#b8bb26"
symbol = "✦"

[direnv]
disabled = false
style = "#8ec07c"

[python]
disabled = false
style = "#b8bb26"
format = ' [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[golang]
disabled = false
style = "#fe8019"
format = ' [$symbol($version )]($style)'

[c]
disabled = false
style = "#d65d0e"
format = ' [$symbol($version(-$name) )]($style)'

[nodejs]
disabled = false
style = "#b8bb26"
format = ' [$symbol($version )]($style)'

[docker_context]
disabled = false
style = "#83a598"
format = ' [$symbol$context]($style)'

[kubernetes]
disabled = false
style = "#8ec07c"
format = ' [$symbol$context( \($namespace\))]($style)'

[terraform]
disabled = false
style = "#83a598"

[aws]
disabled = false
style = "#fabd2f"

[gcloud]
disabled = false
style = "#83a598"

[username]
style_user = "bold #d3869b"
style_root = "bold #fb4934"
format = "[$user]($style)@"
show_always = false

[hostname]
ssh_only = true
style = "bold #d3869b"
format = "[$hostname]($style) "
